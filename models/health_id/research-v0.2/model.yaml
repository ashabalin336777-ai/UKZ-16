model_id: HEALTH_ID
version: research-v0.2
status: research_scaffold
intended_use: research_only
supersedes: research-v0.1

weights:
  hBody: 0.60
  hMental: 0.25
  hSocial: 0.15

policies:
  allow_weighted_partial: false
  renormalize_weights: false
  hidden_imputation: false
  chronic_source: emr_only
  baseline_exclude_current: true
  persistence_unique_dates_only: true
  same_day_attempts_do_not_increase_persistence: true

components:
  hBody:
    formula_id: hBody_vitals_v0
    status_when_calculated: derived
    required_inputs: [bp_systolic_mmhg, bp_diastolic_mmhg, pulse_bpm]
    optional_inputs: [temperature_c, spo2_pct]
  hMental:
    formula_id: hMental_scaffold_v0
    status_when_calculated: derived
    required_inputs: [psychometrics.validated, psychometrics.score]
    missing_reason: no_validated_psychometrics
  hSocial:
    formula_id: hSocial_scaffold_v0
    status_when_calculated: derived
    required_inputs: [social_metrics.validated, social_metrics.engagement_score]
    missing_reason: no_validated_social_metrics

indicators:
  bmi:
    formula_id: bmi_measured
    requires: [height_cm, weight_kg]
    missing_reason: missing_height_weight
    enters_health_id: false
  ap_baevsky:
    formula_id: ap_baevsky_candidate
    requires: [pulse_bpm, bp_systolic_mmhg, bp_diastolic_mmhg, age_years, weight_kg, height_cm]
    missing_height_weight_reason: missing_height_weight
    enters_health_id: false
    apply_classic_thresholds: false
    coefficients:
      pulse: 0.011
      sbp: 0.014
      dbp: 0.008
      age: 0.014
      weight: 0.009
      height: 0.009
      intercept: -0.27

thresholds:
  acute_z: 2.0
  persistence_unique_dates: 3
  pulse_bpm:
    hard_min: 30
    hard_max: 220
  bp_systolic_mmhg:
    hard_min: 60
    hard_max: 260
  bp_diastolic_mmhg:
    hard_min: 30
    hard_max: 160
  height_cm:
    hard_min: 100
    hard_max: 250
  weight_kg:
    hard_min: 30
    hard_max: 300

quality:
  expected_unit_system: SI_medical
  known_protocols:
    - PRMO_STD_v1
    - PRMO_RESEARCH_v1
  reject_unknown_protocol: true
  reject_unknown_unit: true

corridor:
  min_prior_unique_dates: 3
  method: robust_z
  # Floor is on the 0–1 hBody score scale. A floor of 1.0 made the corridor wider than the scale.
  mad_floor: 0.02
  robust_z_scale: 0.6745

psychometrics:
  instruments:
    PHQ-9:
      min: 0
      max: 27
      direction: higher_worse
      formula_id: hMental_phq9_v0
    GAD-7:
      min: 0
      max: 21
      direction: higher_worse
      formula_id: hMental_gad7_v0
    WHO-5:
      min: 0
      max: 100
      direction: higher_better
      formula_id: hMental_who5_v0

scoring:
  pulse_ref_bpm: 70
  pulse_span: 40
  sbp_ref_mmhg: 120
  sbp_span: 40
  dbp_ref_mmhg: 80
  dbp_span: 20
