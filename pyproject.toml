[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ukz16"
version = "0.1.0"
description = "УКЗ-16: исследовательская система клинической валидации HEALTH_ID"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — research use only" }
authors = [{ name = "UKZ-16 research team" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pandera>=0.20.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "hypothesis>=6.112.0",
  "ruff>=0.7.0",
]

[project.scripts]
ukz16-api = "ukz16.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
